name: Release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sources
        shell: bash
        run: |
          set -euo pipefail
          for file in AzerothFitness.toc Bootstrap.lua Core.lua Jump.lua Locale.lua Motion.lua UI.lua README.md LICENSE; do
            test -s "$file"
          done
          grep -q '^## Interface: 16001$' AzerothFitness.toc
          grep -q '^## AllowLoadGameType: camelot$' AzerothFitness.toc
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            grep -q "^## Version: ${version}$" AzerothFitness.toc
          fi
      - name: Validate Lua syntax
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p Bootstrap.lua Core.lua Jump.lua Locale.lua Motion.lua UI.lua
      - name: Pack installable addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/AzerothFitness
          cp AzerothFitness.toc Bootstrap.lua Core.lua Jump.lua Locale.lua Motion.lua UI.lua LICENSE dist/AzerothFitness/
          (cd dist && zip -qr "../AzerothFitness-${GITHUB_REF_NAME:-dev}.zip" AzerothFitness)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: azeroth-fitness-addon
          path: AzerothFitness-*.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" AzerothFitness-*.zip --title "Azeroth Fitness $GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease
