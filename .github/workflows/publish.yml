name: Publish requested version

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azeroth-fitness-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nick-sidorin/azeroth-fitness' && github.ref == 'refs/heads/main'
    # Keep Lua packaging builds on a fixed LTS image as ubuntu-latest rolls forward.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The initial pipeline installation must not publish an unverified addon.
      - name: Read release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < .github/release-request.txt)"
          if [[ "$version" == none ]]; then
            echo 'No public release requested.'
            echo 'requested=false' >> "$GITHUB_OUTPUT"
          else
            echo 'requested=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lua 5.1
        if: steps.request.outputs.requested == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Test and validate requested version
        if: steps.request.outputs.requested == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_ci.sh

          version="$(tr -d '\r\n ' < .github/release-request.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Invalid version in .github/release-request.txt: $version"
            exit 1
          fi
          toc_version="$(sed -n 's/^## Version: *//p' AzerothFitness.toc | tr -d '\r' | head -n1)"
          if [[ "${version%%-*}" != "$toc_version" ]]; then
            echo "::error::TOC version $toc_version differs from requested $version"
            exit 1
          fi
          if ! grep -qF "## [$toc_version]" CHANGELOG.md; then
            echo "::error::Missing CHANGELOG.md entry for $toc_version"
            exit 1
          fi
          tags="$(git ls-remote --tags origin "refs/tags/v$version")"
          if [[ -n "$tags" ]]; then
            echo "::error::Tag v$version already exists; release was already requested"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Package and verify ZIP
        if: steps.request.outputs.requested == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/package_addon.py "dist/AzerothFitness-v$VERSION.zip"

      - name: Create tag and GitHub Release
        if: steps.request.outputs.requested == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Azeroth Fitness $VERSION"
          git push origin "refs/tags/$TAG"

          toc_version="${VERSION%%-*}"
          awk -v heading="## [$toc_version]" '
            index($0, heading) == 1 { active = 1; next }
            active && /^## \[/ { exit }
            active { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Azeroth Fitness $VERSION" > release-notes.md

          args=()
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "dist/AzerothFitness-v$VERSION.zip" \
            --verify-tag \
            --title "Azeroth Fitness v$VERSION" \
            --notes-file release-notes.md \
            "${args[@]}"
